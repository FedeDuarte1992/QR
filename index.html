<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Pro Master Elite</title>
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <style>
        :root { --primary: #c62828; --bg: #f8f9fa; --border: #dee2e6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        
        .main-container { display: grid; grid-template-columns: 1fr 380px; gap: 25px; max-width: 1100px; width: 100%; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

        /* Tabs Superiores de Contenido */
        .type-selector { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .tab-btn { padding: 10px 15px; border: 1px solid var(--border); background: white; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; color: #555; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Acordeones de Configuración */
        .accordion { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px; }
        .acc-header { background: #fff; padding: 14px; cursor: pointer; font-weight: bold; color: var(--primary); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); transition: 0.3s; }
        .acc-header:hover { background: #fff5f5; }
        .acc-content { padding: 20px; display: none; background: white; }
        .acc-content.active { display: block; }

        /* Campos de Entrada */
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 11px; font-weight: bold; color: #666; text-transform: uppercase; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .content-section { display: none; }
        .content-section.active { display: block; }

        /* Vista Previa y Botones */
        .preview-side { display: flex; flex-direction: column; align-items: center; position: sticky; top: 20px; }
        #canvas { background: white; padding: 15px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 15px; }
        .label-display { max-width: 100%; text-align: center; overflow-wrap: anywhere; }
        #topLabelDisplay { margin-bottom: 15px; }
        #bottomLabelDisplay { margin-top: 15px; }
        .btn-download { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 18px; transition: 0.3s; }
        .btn-download:hover { background: #a52121; transform: translateY(-2px); }

        @media (max-width: 900px) { .main-container { grid-template-columns: 1fr; } .preview-side { position: static; } }
    </style>
</head>
<body>

<div class="main-container">
    <div class="editor-side">
        <h2 style="color: #333; margin-top: 0;">Crea tu Código QR</h2>
        
        <div class="type-selector">
            <button class="tab-btn active" onclick="switchTab('url', this)">🔗 Enlace</button>
            <button class="tab-btn" onclick="switchTab('whatsapp', this)">💬 WhatsApp</button>
            <button class="tab-btn" onclick="switchTab('wifi', this)">📶 WiFi</button>
            <button class="tab-btn" onclick="switchTab('text', this)">📄 Texto</button>
        </div>

        <div id="sec-url" class="content-section active">
            <div class="field"><label>URL / LINK</label><input type="text" id="val-url" value="https://google.com" oninput="updateQR()"></div>
        </div>

        <div id="sec-whatsapp" class="content-section">
            <div class="row">
                <div class="field"><label>Teléfono (cód. país)</label><input type="text" id="wa-phone" placeholder="54911..." oninput="updateQR()"></div>
                <div class="field"><label>Mensaje Inicial</label><input type="text" id="wa-msg" placeholder="Hola!" oninput="updateQR()"></div>
            </div>
        </div>

        <div id="sec-wifi" class="content-section">
            <div class="field"><label>Nombre de Red (SSID)</label><input type="text" id="wf-name" placeholder="Mi WiFi" oninput="updateQR()"></div>
            <div class="row">
                <div class="field"><label>Contraseña</label><input type="text" id="wf-pass" placeholder="Password123" oninput="updateQR()"></div>
                <div class="field"><label>Seguridad</label>
                    <select id="wf-enc" onchange="updateQR()"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option><option value="nopass">Sin Clave</option></select>
                </div>
            </div>
        </div>

        <div id="sec-text" class="content-section">
            <div class="field"><label>Tu Mensaje</label><textarea id="val-text" rows="3" oninput="updateQR()"></textarea></div>
        </div>

        <div class="accordion">
            <div class="acc-header" onclick="toggleAcc(this)">🎨 Colores <span>▼</span></div>
            <div class="acc-content active">
                <div class="row">
                    <div class="field"><label>Color de Puntos</label><input type="color" id="dotColor" value="#000000" oninput="updateQR()"></div>
                    <div class="field"><label>Color de Fondo</label><input type="color" id="bgColor" value="#ffffff" oninput="updateQR()"></div>
                </div>
            </div>
        </div>

        <div class="accordion">
            <div class="acc-header" onclick="toggleAcc(this)">🏁 Diseño del QR <span>▼</span></div>
            <div class="acc-content">
                <div class="field">
                    <label for="qrSize">Tamaño del QR: <span id="qrSizeValue">320</span> px</label>
                    <input type="range" id="qrSize" min="160" max="512" step="16" value="320" oninput="updateQR()">
                </div>
                <div class="field">
                    <label>Estilo del Patrón</label>
                    <select id="dotStyle" onchange="updateQR()">
                        <option value="square">Cuadrado</option><option value="dots" selected>Círculos</option><option value="rounded">Redondeado</option><option value="extra-rounded">Gota</option><option value="classy">Elegante</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="accordion">
            <div class="acc-header" onclick="toggleAcc(this)">🖼️ Logo y texto externo <span>▼</span></div>
            <div class="acc-content">
                <div class="field"><label>URL de Logo Central</label><input type="text" id="logoUrl" placeholder="https://..." oninput="updateQR()"></div>
                <div class="field"><label for="bottomLabel">Texto fuera del QR</label><input type="text" id="bottomLabel" value="¡Escanea ahora!" oninput="updateQR()"></div>
                <div class="row">
                    <div class="field">
                        <label for="labelPosition">Ubicación</label>
                        <select id="labelPosition" onchange="updateQR()"><option value="bottom">Debajo del QR</option><option value="top">Arriba del QR</option></select>
                    </div>
                    <div class="field">
                        <label for="labelColor">Color del texto</label>
                        <input type="color" id="labelColor" value="#333333" oninput="updateQR()">
                    </div>
                </div>
                <div class="row">
                    <div class="field">
                        <label for="labelSize">Tamaño del texto (px)</label>
                        <input type="number" id="labelSize" min="10" max="72" value="18" oninput="updateQR()">
                    </div>
                    <div class="field">
                        <label for="labelFont">Tipografía</label>
                        <select id="labelFont" onchange="updateQR()">
                            <option value="Arial, sans-serif">Sans serif</option>
                            <option value="Georgia, serif">Serif</option>
                            <option value="monospace">Monoespaciada</option>
                        </select>
                    </div>
                </div>
                <div class="field">
                    <label><input type="checkbox" id="labelBold" checked onchange="updateQR()" style="width: auto; margin-right: 6px;">Texto en negrita</label>
                </div>
            </div>
        </div>

        <div class="accordion">
            <div class="acc-header" onclick="toggleAcc(this)">🔲 Marco (Esquinas) <span>▼</span></div>
            <div class="acc-content">
                <div class="field">
                    <label>Forma de Esquina</label>
                    <select id="cornerStyle" onchange="updateQR()">
                        <option value="square">Cuadrado</option><option value="dot">Circular</option><option value="extra-rounded" selected>Redondeado</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="preview-side">
        <div id="topLabelDisplay" class="label-display" hidden></div>
        <div id="canvas"></div>
        <div id="bottomLabelDisplay" class="label-display"></div>
        <button class="btn-download" onclick="downloadQR()">✔ Download PNG</button>
    </div>
</div>

<script>
    let currentType = 'url';

    const qrCode = new QRCodeStyling({
        width: 320, height: 320,
        dotsOptions: { color: "#000000", type: "dots" },
        backgroundOptions: { color: "#ffffff" },
        imageOptions: { crossOrigin: "anonymous", margin: 8 }
    });

    qrCode.append(document.getElementById("canvas"));

    function switchTab(type, btn) {
        currentType = type;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.getElementById('sec-' + type).classList.add('active');
        updateQR();
    }

    function toggleAcc(header) {
        const content = header.nextElementSibling;
        content.classList.toggle('active');
        header.querySelector('span').innerText = content.classList.contains('active') ? '▲' : '▼';
    }

    function updateQR() {
        let finalData = "";
        if (currentType === 'url') finalData = document.getElementById('val-url').value;
        if (currentType === 'whatsapp') finalData = `https://wa.me/${document.getElementById('wa-phone').value}?text=${encodeURIComponent(document.getElementById('wa-msg').value)}`;
        if (currentType === 'wifi') finalData = `WIFI:S:${document.getElementById('wf-name').value};T:${document.getElementById('wf-enc').value};P:${document.getElementById('wf-pass').value};;`;
        if (currentType === 'text') finalData = document.getElementById('val-text').value;

        const label = document.getElementById('bottomLabel').value;
        const labelPosition = document.getElementById('labelPosition').value;
        const labelColor = document.getElementById('labelColor').value;
        const labelSize = Math.min(72, Math.max(10, Number(document.getElementById('labelSize').value) || 18));
        const labelFont = document.getElementById('labelFont').value;
        const labelWeight = document.getElementById('labelBold').checked ? 'bold' : 'normal';
        const topLabel = document.getElementById('topLabelDisplay');
        const bottomLabel = document.getElementById('bottomLabelDisplay');
        topLabel.innerText = label;
        bottomLabel.innerText = label;
        topLabel.hidden = !label || labelPosition !== 'top';
        bottomLabel.hidden = !label || labelPosition !== 'bottom';
        [topLabel, bottomLabel].forEach(element => {
            element.style.color = labelColor;
            element.style.fontSize = `${labelSize}px`;
            element.style.fontFamily = labelFont;
            element.style.fontWeight = labelWeight;
        });

        const qrSize = Number(document.getElementById('qrSize').value);
        document.getElementById('qrSizeValue').innerText = qrSize;

        qrCode.update({
            width: qrSize,
            height: qrSize,
            data: finalData || " ",
            dotsOptions: { color: document.getElementById('dotColor').value, type: document.getElementById('dotStyle').value },
            backgroundOptions: { color: document.getElementById('bgColor').value },
            image: document.getElementById('logoUrl').value,
            cornersSquareOptions: { type: document.getElementById('cornerStyle').value, color: document.getElementById('dotColor').value },
            cornersDotOptions: { type: document.getElementById('cornerStyle').value === 'dot' ? 'dot' : 'square', color: document.getElementById('dotColor').value },
            margin: 0
        });
    }

    async function downloadQR() {
        // Enviar evento a Vercel Analytics al descargar
        if (window.va) {
            window.va('event', { name: 'descarga_qr_pro', data: { tipo: currentType } });
        }

        let qrUrl;
        try {
            const qrBlob = await qrCode.getRawData('png');
            qrUrl = URL.createObjectURL(qrBlob);
            const qrImage = new Image();
            await new Promise((resolve, reject) => {
                qrImage.onload = resolve;
                qrImage.onerror = reject;
                qrImage.src = qrUrl;
            });

            const label = document.getElementById('bottomLabel').value.trim();
            const labelPosition = document.getElementById('labelPosition').value;
            const labelSize = Math.min(72, Math.max(10, Number(document.getElementById('labelSize').value) || 18));
            const labelColor = document.getElementById('labelColor').value;
            const labelFont = document.getElementById('labelFont').value;
            const labelWeight = document.getElementById('labelBold').checked ? 'bold' : 'normal';
            const padding = 24;
            const gap = label ? 16 : 0;
            const lineHeight = Math.ceil(labelSize * 1.3);
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const textAreaWidth = qrImage.naturalWidth;
            context.font = `${labelWeight} ${labelSize}px ${labelFont}`;

            const lines = [];
            if (label) {
                let line = '';
                label.split(/\s+/).forEach(word => {
                    const candidate = line ? `${line} ${word}` : word;
                    if (line && context.measureText(candidate).width > textAreaWidth) {
                        lines.push(line);
                        line = word;
                    } else {
                        line = candidate;
                    }
                });
                if (line) lines.push(line);
            }

            const textHeight = lines.length * lineHeight;
            const textBlockHeight = textHeight ? textHeight + gap : 0;
            canvas.width = qrImage.naturalWidth + padding * 2;
            canvas.height = qrImage.naturalHeight + padding * 2 + textBlockHeight;
            context.fillStyle = document.getElementById('bgColor').value;
            context.fillRect(0, 0, canvas.width, canvas.height);

            const qrY = padding + (label && labelPosition === 'top' ? textBlockHeight : 0);
            context.drawImage(qrImage, padding, qrY);
            if (label) {
                context.font = `${labelWeight} ${labelSize}px ${labelFont}`;
                context.fillStyle = labelColor;
                context.textAlign = 'center';
                context.textBaseline = 'top';
                const textY = labelPosition === 'top' ? padding : qrY + qrImage.naturalHeight + gap;
                lines.forEach((textLine, index) => {
                    context.fillText(textLine, canvas.width / 2, textY + index * lineHeight);
                });
            }

            const link = document.createElement('a');
            link.download = 'qr-pro-elite.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        } catch (error) {
            console.error('No se pudo generar el PNG del QR:', error);
            alert('No se pudo generar la imagen. Verifica el logo y vuelve a intentarlo.');
        } finally {
            if (qrUrl) URL.revokeObjectURL(qrUrl);
        }
    }

    // Carga Inicial
    window.onload = updateQR;
</script>

</body>
</html>
